# .goreleaser.yml configuration for SaaSKit
version: 2

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: saaskit
    main: ./cmd/saaskit
    binary: saaskit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

signs:
  - artifacts: checksum
    args:
      - "--yes"
      - "--output"
      - "${signature}"
      - "${artifact}"
      - "--certificate"
      - "${certificate}"
      - "--certificate-identity"
      - "https://github.com/medaminerjb/saaskit/.github/workflows/release.yml@refs/tags/{{ .Tag }}"
      - "--certificate-oidc-issuer"
      - "https://token.actions.githubusercontent.com"
