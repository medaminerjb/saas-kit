name: Release SaaSKit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & Release SaaSKit
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # -------------------------
      # Go Setup
      # -------------------------

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true


      # -------------------------
      # Security checks
      # -------------------------

      - name: Install security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run vulnerability scan
        run: |
          govulncheck ./...


      - name: Run tests
        run: |
          go test ./... -race -coverprofile=coverage.out


      # -------------------------
      # GoReleaser
      # -------------------------

      - name: Release binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean



      # -------------------------
      # Docker
      # -------------------------

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3


      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3


      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Docker metadata
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "tags=\
          ghcr.io/medaminerjb/saaskit:$VERSION,\
          ghcr.io/medaminerjb/saaskit:${GITHUB_REF_NAME},\
          ghcr.io/medaminerjb/saaskit:latest" >> $GITHUB_OUTPUT



      - name: Build SaaSKit image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

          labels: |
            org.opencontainers.image.source=https://github.com/medaminerjb/saaskit
            org.opencontainers.image.description=SaaSKit multi-tenant SaaS infrastructure framework
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}



      # -------------------------
      # SBOM
      # -------------------------

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/medaminerjb/saaskit:${{ steps.meta.outputs.version }}



      # -------------------------
      # Cosign signing
      # -------------------------

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3


      - name: Sign container image
        run: |
          cosign sign \
          --yes \
          ghcr.io/medaminerjb/saaskit:${{ steps.meta.outputs.version }}



      # -------------------------
      # Build provenance
      # -------------------------

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/medaminerjb/saaskit
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true