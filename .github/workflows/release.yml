name: Release SaaSKit

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  attestations: write

jobs:
  release:
    name: Build & Release SaaSKit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0


      # -------------------------
      # Go Setup
      # -------------------------

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true


      # -------------------------
      # GoReleaser
      # -------------------------

      - name: Release binaries
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean



      # -------------------------
      # Docker
      # -------------------------

      - name: Setup QEMU
        uses: docker/setup-qemu-action@49b3bc8e6dda4a8977600bea456c932b0a9609ac # v3.3.0


      - name: Setup Buildx
        uses: docker/setup-buildx-action@b5e57e7c7db8d691c5e4c09ef6368d782a928d6f # v3.10.0


      - name: Login GHCR
        uses: docker/login-action@9780b0c442fbb5b8788c0f751f4c8b67e896e3e7 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Docker metadata
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME#v}

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          echo "tags=\
          ghcr.io/medaminerjb/saaskit:$VERSION,\
          ghcr.io/medaminerjb/saaskit:${GITHUB_REF_NAME},\
          ghcr.io/medaminerjb/saaskit:latest" >> $GITHUB_OUTPUT



      - name: Build SaaSKit image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

          labels: |
            org.opencontainers.image.source=https://github.com/medaminerjb/saaskit
            org.opencontainers.image.description=SaaSKit multi-tenant SaaS infrastructure framework
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}



      # -------------------------
      # SBOM
      # -------------------------

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/medaminerjb/saaskit:${{ steps.meta.outputs.version }}



      # -------------------------
      # Cosign signing
      # -------------------------

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2


      - name: Sign container image
        run: |
          cosign sign \
          --yes \
          ghcr.io/medaminerjb/saaskit:${{ steps.meta.outputs.version }}



      # -------------------------
      # Build provenance
      # -------------------------

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/medaminerjb/saaskit
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true