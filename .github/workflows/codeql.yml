name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@PINNED_SHA

      - uses: github/codeql-action/init@PINNED_SHA
        with:
          languages: go

      - uses: github/codeql-action/analyze@PINNED_SHA