name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saaskit
          POSTGRES_PASSWORD: saaskit
          POSTGRES_DB: saaskit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saaskit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run unit tests
        run: go test -v -race -count=1 -short -coverprofile=coverage.out ./...
      - name: Run integration tests
        env:
          SAASKIT_DATABASE_URL: postgres://saaskit:saaskit@localhost:5432/saaskit_test?sslmode=disable
          SAASKIT_SERVER_SECRET: ci-test-secret-00000000000000000000000000000000000000000000
          SAASKIT_ENCRYPTION_MASTER_KEY: 6368616e676520746869732070617373776f726420746f206120736563726574
        run: go test -v -race -count=1 -run Integration ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build binary
        run: go build -o bin/saaskit ./cmd/saaskit
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t saaskit:test .
