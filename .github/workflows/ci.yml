name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  GO_VERSION: "1.26.5"
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11

  sqlc:
    name: SQLC Diff Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest

      - name: Verify generated code is in sync
        run: make sqlc-check

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saaskit
          POSTGRES_PASSWORD: saaskit
          POSTGRES_DB: saaskit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saaskit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -count=1 -short -coverprofile=coverage.out ./...

      - name: Run integration tests
        env:
          SAASKIT_DATABASE_HOST: localhost
          SAASKIT_DATABASE_PORT: "5432"
          SAASKIT_DATABASE_USER: saaskit
          SAASKIT_DATABASE_PASSWORD: saaskit
          SAASKIT_DATABASE_NAME: saaskit_test
          SAASKIT_DATABASE_SSLMODE: disable
          SAASKIT_SERVER_SECRET: ci-test-secret-00000000000000000000000000000000000000000000
          SAASKIT_ENCRYPTION_MASTER_KEY: 6368616e676520746869732070617373776f726420746f206120736563726574
        run: go test -v -race -count=1 -run Integration ./...

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: |  
          mkdir -p bin
          go build -trimpath -o bin/saaskit ./cmd/saaskit

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t saaskit:test .

  vulncheck:
    name: Security Scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...